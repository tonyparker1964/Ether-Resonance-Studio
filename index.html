<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080d18">
<title>Ether Resonance Studio</title>
<style>
:root{color-scheme:dark;--bg:#080d18;--sidebar:#0b1120;--surface:#10192a;--surface2:#131f33;--line:#202d43;--text:#edf4ff;--muted:#8f9eb4;--soft:#bdc9da;--cyan:#73d7f4;--blue:#80a9ff;--violet:#bb9dff;--orange:#ffad75;--green:#8de1bf;--danger:#ff7c86;--radius:18px;--shadow:0 18px 55px rgba(0,0,0,.18)}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 75% -15%,#192e4b 0,transparent 37%),var(--bg);color:var(--text);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}button,input,select,textarea{font:inherit}button{cursor:pointer;color:inherit}.app{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100vh}.sidebar{background:rgba(9,15,27,.9);border-right:1px solid var(--line);padding:25px 16px 18px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}.brand{display:flex;align-items:center;gap:12px;padding:4px 9px 31px}.brand-mark{width:39px;height:39px;border:1px solid #38607b;border-radius:14px;display:grid;place-items:center;color:var(--cyan);background:linear-gradient(145deg,#162c40,#101a2a);font-size:20px}.brand-name{font-size:14px;font-weight:760;letter-spacing:.075em}.brand-sub{font-size:10px;letter-spacing:.16em;color:var(--muted);margin-top:2px}.nav-label{font-size:9px;letter-spacing:.18em;font-weight:800;color:#65738a;padding:0 12px 9px}.nav{display:grid;gap:5px}.nav-btn{text-decoration:none;border:0;background:transparent;border-radius:11px;text-align:left;padding:11px 12px;color:var(--muted);display:flex;align-items:center;gap:12px;transition:.18s}.nav-btn:hover{background:#111b2c;color:var(--text)}.nav-btn.active{background:linear-gradient(90deg,#17283b,#131e30);color:var(--text);box-shadow:inset 2px 0 var(--cyan)}.nav-ico{width:20px;text-align:center;font-size:16px}.nav-name{font-weight:600}.sidebar-bottom{margin-top:auto;border-top:1px solid var(--line);padding:16px 10px 2px}.local-state{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--soft)}.green-dot{width:7px;height:7px;background:var(--green);border-radius:50%;box-shadow:0 0 12px #8de1bf66}.sidebar-note{font-size:10px;color:#75839a;margin-top:7px;line-height:1.55}.main{min-width:0}.topbar{height:70px;border-bottom:1px solid rgba(32,45,67,.8);display:flex;align-items:center;justify-content:space-between;padding:0 clamp(20px,4vw,48px);position:sticky;top:0;background:rgba(8,13,24,.78);backdrop-filter:blur(18px);z-index:5}.crumb{font-size:12px;color:var(--muted)}.top-right{display:flex;align-items:center;gap:10px}.tiny-pill{font-size:10px;color:var(--cyan);border:1px solid #284258;background:#102031;padding:6px 10px;border-radius:99px;letter-spacing:.04em}.icon-btn{border:1px solid var(--line);background:#111a29;color:var(--soft);border-radius:10px;padding:8px 11px}.content{max-width:1500px;margin:auto;padding:34px clamp(20px,4vw,48px) 50px}.eyebrow{font-size:10px;letter-spacing:.2em;font-weight:800;color:var(--cyan);text-transform:uppercase}.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:22px;margin-bottom:28px}.page-head h1{font-size:clamp(25px,3vw,34px);letter-spacing:-.035em;line-height:1.15;margin:8px 0}.page-head p{margin:0;color:var(--muted);max-width:690px}.head-actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:#172337;color:var(--text);padding:10px 14px;border-radius:10px;font-weight:650;transition:.18s}.btn:hover{border-color:#47617e;transform:translateY(-1px)}.btn.primary{background:linear-gradient(135deg,#57c9e4,#8bb3ff);border:0;color:#07111c;box-shadow:0 7px 22px #57c9e422}.btn.ghost{background:transparent;color:var(--soft)}.btn.danger{background:#341e2a;border-color:#64313e;color:#ffc1c4}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.card{border:1px solid var(--line);background:linear-gradient(145deg,rgba(18,29,47,.95),rgba(13,22,37,.95));border-radius:var(--radius);box-shadow:var(--shadow)}.instrument-card{padding:21px;min-height:204px;display:flex;flex-direction:column;gap:14px;position:relative;overflow:hidden}.instrument-card:after{content:"";width:170px;height:170px;border-radius:50%;position:absolute;right:-70px;top:-80px;background:var(--glow);filter:blur(44px);opacity:.12;pointer-events:none}.instrument-top{display:flex;align-items:center;justify-content:space-between}.instrument-icon{width:44px;height:44px;border-radius:14px;background:var(--icon-bg);display:grid;place-items:center;color:var(--accent);font-size:20px;border:1px solid color-mix(in srgb,var(--accent) 25%,transparent)}.status{font-size:9px;letter-spacing:.1em;font-weight:800;color:#bdc8d8;display:flex;align-items:center;gap:7px}.status-dot{width:6px;height:6px;background:#f2b36e;border-radius:50%}.instrument-card h2{font-size:18px;margin:0;letter-spacing:-.02em}.instrument-card p{color:var(--muted);margin:0;max-width:470px;font-size:12px}.card-foot{display:flex;justify-content:space-between;align-items:center;margin-top:auto;color:var(--accent);font-size:11px;font-weight:700}.link-btn{border:0;background:transparent;color:inherit;padding:0;font-weight:700}.small-arrow{font-size:16px}.section-title{font-size:15px;margin:0 0 12px}.recent{margin-top:27px}.recent-head{display:flex;align-items:center;justify-content:space-between}.list{display:grid;gap:7px}.session-row{display:grid;grid-template-columns:36px minmax(0,1fr) auto;align-items:center;gap:12px;padding:12px 14px;border:1px solid rgba(32,45,67,.75);border-radius:13px;background:rgba(16,25,42,.55)}.row-icon{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;color:var(--accent);background:var(--icon-bg)}.row-main{min-width:0}.row-title{font-size:12px;font-weight:720}.row-sub{font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px}.row-time{font-size:11px;font-variant-numeric:tabular-nums;color:var(--soft)}.empty{border:1px dashed #304057;border-radius:14px;padding:23px;color:var(--muted);text-align:center}.two-col{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(280px,.8fr);gap:16px;align-items:start}.panel-card{padding:21px}.panel-title{display:flex;align-items:center;gap:11px;margin-bottom:15px}.panel-title h2{font-size:15px;margin:0}.panel-title .sub{font-size:10px;color:var(--muted);margin-top:2px}.connection{padding:14px;border-radius:13px;background:#151f30;border:1px solid #26354b;margin-bottom:18px}.conn-top{display:flex;align-items:center;justify-content:space-between;gap:10px}.conn-label{font-weight:700;font-size:12px}.badge{font-size:9px;font-weight:800;letter-spacing:.08em;border:1px solid #704c2e;background:#30271e;color:#f3c18a;border-radius:99px;padding:5px 8px;white-space:nowrap}.connection p{margin:8px 0 0;color:var(--muted);font-size:11px}.notice{margin-top:10px;color:#a8c5d8;font-size:10px;line-height:1.5;display:flex;gap:7px}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.field{display:grid;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:9px;letter-spacing:.12em;font-weight:800;color:#97a8bf;text-transform:uppercase}.field input,.field select,.field textarea{width:100%;padding:10px 11px;border-radius:9px;border:1px solid #293950;background:#0b1423;color:var(--text);outline:none}.field input:focus,.field select:focus,.field textarea:focus{border-color:#5eafca;box-shadow:0 0 0 3px #5eafca17}.field input::placeholder,.field textarea::placeholder{color:#62718a}.field select{appearance:auto}.field textarea{min-height:95px;resize:vertical}.form-footer{font-size:10px;color:#738199;margin-top:12px}.recorder{padding:21px}.timer{font-size:35px;line-height:1.1;font-variant-numeric:tabular-nums;letter-spacing:.02em;margin:16px 0 4px}.timer.active{color:#ff8b94}.timer-caption{font-size:11px;color:var(--muted)}.recorder-actions{display:grid;gap:9px;margin-top:19px}.recorder-actions .btn{width:100%}.mini-stat{display:flex;justify-content:space-between;border-top:1px solid var(--line);padding-top:14px;margin-top:17px;font-size:11px;color:var(--muted)}.mini-stat strong{color:var(--text)}.notice-card{padding:16px;border:1px solid #2b3b50;border-radius:13px;color:#9fb3c8;background:#101b2a;font-size:11px;line-height:1.6;margin-top:14px}.history-toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:15px}.filter{background:#111b2b;border:1px solid #26354b;color:var(--muted);border-radius:9px;padding:8px 11px;font-size:11px}.filter.active{color:var(--text);border-color:#5388a1;background:#15283a}.history-item{display:grid;grid-template-columns:40px minmax(0,1fr) auto auto;align-items:center;gap:12px;padding:14px;border-bottom:1px solid rgba(32,45,67,.75)}.history-item:last-child{border-bottom:0}.delete-btn{background:transparent;border:0;color:#728198;font-size:15px;padding:5px 8px}.delete-btn:hover{color:var(--danger)}.history-date{font-size:10px;color:var(--muted);white-space:nowrap}.history-duration{font-size:11px;color:var(--soft);min-width:55px;text-align:right}.privacy{font-size:10px;color:#687991;margin-top:17px}.toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,15px);background:#dffbef;color:#0c291e;padding:10px 15px;border-radius:10px;font-size:12px;font-weight:700;opacity:0;pointer-events:none;transition:.2s;z-index:15}.toast.show{opacity:1;transform:translate(-50%,0)}.mobile-menu{display:none}
@media(max-width:1050px){.app{grid-template-columns:215px minmax(0,1fr)}.two-col{grid-template-columns:1fr}.recorder{display:grid;grid-template-columns:1fr auto;align-items:center}.recorder .panel-title{grid-column:1/-1}.timer-wrap{grid-column:1}.recorder-actions{grid-column:2;grid-row:2/4;min-width:205px;margin:0}.mini-stat{grid-column:1/-1}.grid{gap:12px}}
@media(max-width:740px){.app{display:block}.sidebar{position:fixed;left:0;top:0;z-index:20;width:min(290px,84vw);transform:translateX(-103%);transition:.22s;box-shadow:var(--shadow)}.sidebar.open{transform:translateX(0)}.mobile-menu{display:inline-flex}.topbar{height:60px;padding:0 16px}.content{padding:26px 16px 40px}.page-head{display:block}.head-actions{margin-top:16px}.grid{grid-template-columns:1fr}.instrument-card{min-height:180px}.two-col{grid-template-columns:1fr}.recorder{display:block}.recorder-actions{display:grid;min-width:0;margin-top:18px}.mini-stat{margin-top:16px}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.history-item{grid-template-columns:36px minmax(0,1fr) auto}.history-date{grid-column:2;grid-row:2}.history-duration{grid-column:3;grid-row:1}.delete-btn{grid-column:3;grid-row:2}.top-right .tiny-pill{display:none}}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand"><div class="brand-mark">✧</div><div><div class="brand-name">ETHER STUDIO</div><div class="brand-sub">RESONANCE JOURNAL</div></div></div>
    <div class="nav-label">WORKSPACE</div>
    <nav class="nav" aria-label="Main navigation">
      <button class="nav-btn active" data-page="overview"><span class="nav-ico">◈</span><span class="nav-name">Overview</span></button>
      <button class="nav-btn" data-page="spooky"><span class="nav-ico" style="color:var(--blue)">〰</span><span class="nav-name">Spooky2 + Scalar</span></button>
      <button class="nav-btn" data-page="muse"><span class="nav-ico" style="color:var(--violet)">◉</span><span class="nav-name">Muse</span></button>
      <button class="nav-btn" data-page="flame"><span class="nav-ico" style="color:var(--orange)">♨</span><span class="nav-name">FlameInSound</span></button>
      <button class="nav-btn" data-page="history"><span class="nav-ico">◷</span><span class="nav-name">Session history</span></button>\n      <a class="nav-btn" href="./about.html"><span class="nav-ico">ⓘ</span><span class="nav-name">About</span></a>
    </nav>
    <div class="sidebar-bottom"><div class="local-state"><span class="green-dot"></span>Saved in this browser</div><div class="sidebar-note">Sessions stay on this device unless you export them. Instruments are logged independently.</div></div>
  </aside>
  <main class="main">
    <header class="topbar"><div style="display:flex;align-items:center;gap:12px"><button class="icon-btn mobile-menu" id="menuBtn" aria-label="Open menu">☰</button><div class="crumb" id="crumb">Workspace&nbsp; / &nbsp;Overview</div></div><div class="top-right"><span class="tiny-pill">PRIVATE · LOCAL STORAGE</span><button class="icon-btn" id="exportTop" title="Export sessions as CSV">⇩ <span style="font-size:11px">Export</span></button></div></header>
    <section class="content" id="content"></section>
  </main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
(()=>{
'use strict';
const KEY='ether-resonance-studio-v1';
const CONFIG={
 spooky:{id:'spooky',title:'Spooky2 + Scalar',icon:'〰',accent:'var(--blue)',glow:'#5b8cff',iconBg:'#17243b',short:'GeneratorX and Scalar session details',headline:'Keep your GeneratorX and Scalar sessions in one record.',description:'Record the GeneratorX program, output mode, Scalar setup, and session notes together.',connection:'This panel records settings and time. It does not send commands to the GeneratorX or Scalar.',independence:'GeneratorX and Scalar are tracked as one setup here. FlameInSound audio is not routed to this hardware.',fields:[{key:'generator',label:'Generator',type:'select',options:['GeneratorX','GeneratorX Pro','Other / not sure'],value:'GeneratorX'},{key:'mode',label:'Output mode',type:'select',options:['Contact','Remote','Scalar','Other'],value:'Scalar'},{key:'program',label:'Preset or program',type:'text',placeholder:'Name or file reference'},{key:'scalar',label:'Scalar setup',type:'select',options:['In use','Not in use','Not sure'],value:'In use'}]},
 muse:{id:'muse',title:'Muse',icon:'◉',accent:'var(--violet)',glow:'#a07cff',iconBg:'#241d3b',short:'Mindfulness session notes and duration',headline:'Keep a clear record of your Muse practice.',description:'Log your headset, session style, source app, duration, and optional self-reported focus or calm rating.',connection:'This panel logs sessions only. It does not pair with Muse or read live EEG data.',independence:'Muse records stay independent from Spooky2 and FlameInSound. No signal sync is assumed.',fields:[{key:'headset',label:'Muse device',type:'select',options:['Muse 2','Muse S','Other Muse','Not sure'],value:'Muse 2'},{key:'practice',label:'Session type',type:'select',options:['Meditation','Breathing','Focus','Sleep','Other'],value:'Meditation'},{key:'app',label:'App used',type:'text',placeholder:'App name or version'},{key:'rating',label:'Focus / calm rating',type:'text',placeholder:'Optional, e.g. 1–10'}]},
 flame:{id:'flame',title:'FlameInSound',icon:'♨',accent:'var(--orange)',glow:'#ff8b4f',iconBg:'#35251e',short:'Audio frequency session details',headline:'Capture what you played and how you listened.',description:'Log the session or track name, any frequency shown in FlameInSound, playback device, and listening setup.',connection:'FlameInSound runs on your iPhone or iPad. This panel logs its settings; it does not control or connect to the mobile app.',independence:'No direct sync with GeneratorX, Scalar, or Muse. Use this journal to line up notes and times only.',fields:[{key:'device',label:'Playback device',type:'select',options:['iPhone','iPad','Other'],value:'iPhone'},{key:'session',label:'Session or track',type:'text',placeholder:'Name shown in the app'},{key:'frequency',label:'Frequency shown',type:'text',placeholder:'Enter Hz if displayed'},{key:'setup',label:'Listening setup',type:'select',options:['Phone speaker','Headphones','External speaker','Other'],value:'Headphones'}]}
};
let state=loadState();let page='overview';let historyFilter='all';let toastTimer;
function loadState(){try{const saved=JSON.parse(localStorage.getItem(KEY)||'{}');return{sessions:Array.isArray(saved.sessions)?saved.sessions:[],drafts:saved.drafts||{},active:saved.active||{}}}catch{return{sessions:[],drafts:{},active:{}}}}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch{notify('Browser storage is full. Export your records to keep a backup.')}}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function fmtTime(ms){let sec=Math.max(0,Math.floor(ms/1000)),h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;return`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`}
function duration(a,b){let s=Math.max(0,Math.floor((b-a)/1000)),h=Math.floor(s/3600),m=Math.floor(s%3600/60),sec=s%60;return h?`${h}h ${m}m`:m?`${m}m ${sec}s`:`${sec}s`}
function dateLabel(d){return new Date(d).toLocaleString([],{month:'short',day:'numeric',year:'numeric',hour:'numeric',minute:'2-digit'})}
function cfgFor(id){return CONFIG[id]}
function go(next){page=next;document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('active',b.dataset.page===next));document.getElementById('sidebar').classList.remove('open');document.getElementById('crumb').innerHTML=`Workspace&nbsp; / &nbsp;${esc(next==='overview'?'Overview':next==='history'?'Session history':CONFIG[next].title)}`;render()}
function navCard(id){const c=CONFIG[id],count=state.sessions.filter(s=>s.kind===id).length;return`<article class="card instrument-card" style="--accent:${c.accent};--glow:${c.glow};--icon-bg:${c.iconBg}"><div class="instrument-top"><div class="instrument-icon">${c.icon}</div><div class="status"><span class="status-dot"></span>MANUAL LOGGING</div></div><h2>${c.title}</h2><p>${c.short}</p><div class="card-foot"><span>${count} saved session${count===1?'':'s'}</span><button class="link-btn" data-open="${id}">Open panel <span class="small-arrow">↗</span></button></div></article>`}
function row(s){const c=cfgFor(s.kind);const summary=Object.values(s.settings||{}).filter(Boolean).join(' · ')||'No settings recorded';const note=s.notes?` · ${s.notes}`:'';return`<div class="session-row" style="--accent:${c.accent};--icon-bg:${c.iconBg}"><div class="row-icon">${c.icon}</div><div class="row-main"><div class="row-title">${esc(c.title)} <span style="font-weight:400;color:var(--muted)">· ${esc(dateLabel(s.startedAt))}</span></div><div class="row-sub">${esc(summary+note)}</div></div><div class="row-time">${esc(duration(s.startedAt,s.endedAt))}</div></div>`}
function renderOverview(){const recent=[...state.sessions].sort((a,b)=>b.startedAt-a.startedAt).slice(0,5);return`<div class="page-head"><div><div class="eyebrow">AWARENESS · SOUND · RECORD</div><h1>Resonance Studio</h1><p>One private journal for your GeneratorX and Scalar setup, Muse practice, and FlameInSound listening sessions.</p></div><div class="head-actions"><button class="btn ghost" data-action="backup">⇧ Backup data</button><button class="btn primary" data-open="spooky">＋ Start a session</button></div></div><div class="grid">${navCard('spooky')}${navCard('muse')}${navCard('flame')}<article class="card instrument-card" style="--accent:var(--cyan);--glow:#65d4ee;--icon-bg:#142e3b"><div class="instrument-top"><div class="instrument-icon">▤</div><div class="status"><span class="green-dot"></span>ON THIS DEVICE</div></div><h2>Shared session history</h2><p>Each entry keeps its own settings, notes, and start time. The panels do not imply device sync.</p><div class="card-foot"><span>${state.sessions.length} total entr${state.sessions.length===1?'y':'ies'}</span><button class="link-btn" data-open="history">View timeline <span class="small-arrow">↗</span></button></div></article></div><section class="recent"><div class="recent-head"><h2 class="section-title">Recent sessions</h2><button class="link-btn" style="color:var(--cyan)" data-open="history">View all →</button></div><div class="list">${recent.length?recent.map(row).join(''):'<div class="empty">Your first saved session will appear here.</div>'}</div><div class="privacy">Sessions are stored in this browser on this device. Export a backup before clearing browser data.</div></section>`}
function fieldHTML(id,f){const value=(state.drafts[id]||{})[f.key]??f.value??'';let control;if(f.type==='select'){control=`<select data-draft="${f.key}">${f.options.map(o=>`<option ${value===o?'selected':''}>${esc(o)}</option>`).join('')}</select>`}else{control=`<input data-draft="${f.key}" type="text" placeholder="${esc(f.placeholder||'')}" value="${esc(value)}">`}return`<div class="field"><label>${esc(f.label)}</label>${control}</div>`}
function renderPanel(id){const c=CONFIG[id],draft=state.drafts[id]||{};const active=state.active[id];let notes=active?active.notes||'':draft.notes||'';const current=state.sessions.filter(s=>s.kind===id).length;return`<div class="page-head"><div><div class="eyebrow">INSTRUMENT PANEL</div><h1>${c.title}</h1><p>${c.description}</p></div></div><div class="two-col"><div class="card panel-card"><div class="panel-title"><div class="instrument-icon" style="--accent:${c.accent};--icon-bg:${c.iconBg}">${c.icon}</div><div><h2>Session settings</h2><div class="sub">Captured with each saved entry</div></div></div><div class="connection"><div class="conn-top"><div class="conn-label">Connection status</div><div class="badge">NOT CONNECTED</div></div><p>${c.connection}</p><div class="notice"><span>ⓘ</span><span>${c.independence}</span></div></div><div class="form-grid">${c.fields.map(f=>{const html=fieldHTML(id,f);return active?html.replace('<select ','<select disabled ').replace('<input ','<input disabled '):html}).join('')}<div class="field full"><label>Session notes</label><textarea data-notes placeholder="Add context, observations, or anything you want to remember…" ${active?'':' '}>${esc(notes)}</textarea></div></div><div class="form-footer">Settings and notes are included in your session record.</div></div><div><div class="card recorder"><div class="panel-title"><div class="instrument-icon" style="--accent:${c.accent};--icon-bg:${c.iconBg}">◷</div><div><h2>Session recorder</h2><div class="sub">Timer and shared journal</div></div></div><div class="timer-wrap"><div class="timer ${active?'active':''}" data-timer="${id}">${active?fmtTime(Date.now()-active.startedAt):'00:00:00'}</div><div class="timer-caption" data-caption="${id}">${active?'Recording on this device':'Ready to record'}</div></div><div class="recorder-actions">${active?`<button class="btn danger" data-stop="${id}">■ Stop and save</button><button class="btn ghost" data-cancel="${id}">Cancel session</button>`:`<button class="btn primary" data-start="${id}">● Start session log</button>`}</div><div class="mini-stat"><span>Saved sessions</span><strong>${current}</strong></div></div><div class="notice-card"><strong style="color:var(--text)">Independent by design.</strong><br>${esc(c.independence)}</div></div></div>`}
function renderHistory(){const filters=[['all','All systems'],['spooky','Spooky2'],['muse','Muse'],['flame','FlameInSound']];const items=[...state.sessions].filter(s=>historyFilter==='all'||s.kind===historyFilter).sort((a,b)=>b.startedAt-a.startedAt);return`<div class="page-head"><div><div class="eyebrow">YOUR PRACTICE</div><h1>Session history</h1><p>Review records across your three independent systems.</p></div><div class="head-actions"><button class="btn ghost" data-action="backup">⇧ Backup JSON</button><button class="btn primary" data-action="csv">⇩ Export CSV</button></div></div><div class="card panel-card"><div class="history-toolbar">${filters.map(([v,label])=>`<button class="filter ${historyFilter===v?'active':''}" data-filter="${v}">${label}</button>`).join('')}<span style="margin-left:auto;color:var(--muted);font-size:11px">${items.length} entr${items.length===1?'y':'ies'}</span></div>${items.length?items.map(s=>{const c=CONFIG[s.kind];const summary=Object.entries(s.settings||{}).filter(([,v])=>v).map(([,v])=>v).join(' · ');return`<div class="history-item" style="--accent:${c.accent};--icon-bg:${c.iconBg}"><div class="row-icon">${c.icon}</div><div class="row-main"><div class="row-title">${esc(c.title)}</div><div class="row-sub">${esc(summary||'No settings recorded')}${s.notes?' · '+esc(s.notes):''}</div></div><div class="history-duration">${esc(duration(s.startedAt,s.endedAt))}</div><div class="history-date">${esc(dateLabel(s.startedAt))}</div><button class="delete-btn" title="Delete session" aria-label="Delete session" data-delete="${esc(s.id)}">×</button></div>`}).join(''):'<div class="empty">No sessions in this view yet.</div>'}</div><div class="privacy">All records stay in this browser. Use Backup JSON to move your journal to another device.</div>`}
function render(){const el=document.getElementById('content');el.innerHTML=page==='overview'?renderOverview():page==='history'?renderHistory():renderPanel(page);bindPage();updateAllTimers()}
function notify(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2400)}
function saveDraft(id){const d={...(state.drafts[id]||{})};document.querySelectorAll('#content [data-draft]').forEach(e=>{d[e.dataset.draft]=e.value});const n=document.querySelector('#content [data-notes]');if(n)d.notes=n.value;state.drafts[id]=d;persist()}
function bindPage(){document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>go(b.dataset.open));document.querySelectorAll('[data-draft]').forEach(e=>e.addEventListener('input',()=>saveDraft(page)));document.querySelectorAll('[data-notes]').forEach(e=>e.addEventListener('input',()=>{if(state.active[page]){state.active[page].notes=e.value;persist()}else saveDraft(page)}));document.querySelectorAll('[data-start]').forEach(b=>b.onclick=()=>startSession(b.dataset.start));document.querySelectorAll('[data-stop]').forEach(b=>b.onclick=()=>stopSession(b.dataset.stop));document.querySelectorAll('[data-cancel]').forEach(b=>b.onclick=()=>cancelSession(b.dataset.cancel));document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{historyFilter=b.dataset.filter;render()});document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>deleteSession(b.dataset.delete));document.querySelectorAll('[data-action="csv"]').forEach(b=>b.onclick=exportCSV);document.querySelectorAll('[data-action="backup"]').forEach(b=>b.onclick=exportJSON)}
function startSession(id){saveDraft(id);const draft=state.drafts[id]||{};const settings={...draft};delete settings.notes;state.active[id]={startedAt:Date.now(),settings,notes:draft.notes||''};persist();notify(`${CONFIG[id].title} session started`);render()}
function stopSession(id){const a=state.active[id];if(!a)return;const endedAt=Date.now();state.sessions.push({id:crypto.randomUUID?crypto.randomUUID():String(endedAt)+Math.random(),kind:id,startedAt:a.startedAt,endedAt,settings:a.settings,notes:a.notes||''});delete state.active[id];state.drafts[id]={...(state.drafts[id]||{}),notes:''};persist();notify('Session saved to this browser');render()}
function cancelSession(id){if(!confirm('Cancel this timer without saving a session?'))return;delete state.active[id];persist();render()}
function deleteSession(id){if(!confirm('Delete this session from this browser?'))return;state.sessions=state.sessions.filter(s=>s.id!==id);persist();render()}
function updateAllTimers(){Object.keys(state.active).forEach(id=>{const a=state.active[id],timer=document.querySelector(`[data-timer="${id}"]`),caption=document.querySelector(`[data-caption="${id}"]`);if(timer)timer.textContent=fmtTime(Date.now()-a.startedAt);if(caption)caption.textContent='Recording on this device'})}
function exportCSV(){if(!state.sessions.length){notify('No saved sessions to export yet');return}const rows=[['System','Start time','End time','Duration','Settings','Notes']];[...state.sessions].sort((a,b)=>a.startedAt-b.startedAt).forEach(s=>{const c=CONFIG[s.kind];rows.push([c.title,new Date(s.startedAt).toISOString(),new Date(s.endedAt).toISOString(),duration(s.startedAt,s.endedAt),Object.entries(s.settings||{}).map(([k,v])=>`${k}=${v}`).join('; '),s.notes||''])});const csv=rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n');download(new Blob([csv],{type:'text/csv;charset=utf-8'}),'Ether-Resonance-Sessions.csv');notify('CSV exported')}
function exportJSON(){const payload={app:'Ether Resonance Studio',version:1,exportedAt:new Date().toISOString(),sessions:state.sessions};download(new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}),'Ether-Resonance-Backup.json');notify('JSON backup exported')}
function download(blob,name){const a=document.createElement('a'),url=URL.createObjectURL(blob);a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
document.querySelectorAll('.nav-btn').forEach(b=>{if(b.dataset.page)b.onclick=()=>go(b.dataset.page)});document.getElementById('exportTop').onclick=exportCSV;document.getElementById('menuBtn').onclick=()=>document.getElementById('sidebar').classList.toggle('open');document.addEventListener('click',e=>{if(e.target===document.getElementById('content')&&innerWidth<740)document.getElementById('sidebar').classList.remove('open')});setInterval(updateAllTimers,1000);render();
})();
</script>
</body>
</html>
